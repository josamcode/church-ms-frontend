name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test & build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: ['20.x', '22.x']

    env:
      CI: 'true'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Non-watch mode. `react-scripts test` otherwise hangs forever on a runner.
      - name: Run tests
        run: npm run test:ci

      # This is the repo's own production build. It intentionally does NOT set
      # CI=true: react-scripts promotes every ESLint warning to a build error
      # under CI=true, and this codebase carries a backlog of pre-existing
      # `no-unused-vars` / `react-hooks/exhaustive-deps` warnings. Gating on them
      # here would make CI red on arrival for reasons unrelated to any change.
      # The warnings are surfaced by the non-blocking lint step below instead;
      # tighten this to CI=true once that backlog reaches zero.
      - name: Production build
        run: npm run build

      - name: Lint report (non-blocking)
        continue-on-error: true
        run: |
          echo "### ESLint warnings" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          npx eslint src --ext .js,.jsx 2>&1 | tail -60 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Report bundle size
        run: |
          echo "### Build output" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          du -sh build >> "$GITHUB_STEP_SUMMARY"
          find build/static/js -name '*.js' -printf '%f\t%s bytes\n' \
            | sort -k2 -rn | head -10 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-node-${{ matrix.node-version }}
          path: build/
          retention-days: 7

      - name: Check for whitespace errors
        run: git diff --check HEAD
